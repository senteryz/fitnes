  <path d="M 215 680 Q 185.0 671.3 160 690 Q 190.0 698.8 215 680 Z" fill="url(#hero-gold-leaf-r)" stroke="#9e7d2e" stroke-width="0.8" class="hero-leaf" filter="url(#hero-leaf-shadow-r)">
