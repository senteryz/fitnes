  </path>
  <path d="M 190 490 Q 175.0 457.5 140 450 Q 155.0 482.5 190 490 Z" fill="url(#hero-gold-leaf-r)" stroke="#9e7d2e" stroke-width="0.8" class="hero-leaf" filter="url(#hero-leaf-shadow-r)">
    <animateTransform 
      attributeName="transform" 
      type="rotate" 
      values="0 190 490; -5.5 190 490; 2.75 190 490; 0 190 490" 
      dur="6.4s" 
      begin="-3s" 
      repeatCount="indefinite" 
    />
  </path>
  <path d="M 222 430 Q 241.0 452.0 270 450 Q 251.0 428.0 222 430 Z" fill="url(#hero-green-leaf-r)" stroke="#4a5d30" stroke-width="0.8" class="hero-leaf" filter="url(#hero-leaf-shadow-r)">
    <animateTransform 
      attributeName="transform" 
      type="rotate" 
      values="0 222 430; -3.5 222 430; 1.75 222 430; 0 222 430" 
      dur="7.1s" 
      begin="-0s" 
      repeatCount="indefinite" 
    />
  </path>
  <path d="M 200 330 Q 225.0 330.0 240 310 Q 215.0 310.0 200 330 Z" fill="url(#hero-green-leaf-r)" stroke="#4a5d30" stroke-width="0.8" class="hero-leaf" filter="url(#hero-leaf-shadow-r)">
    <animateTransform 
      attributeName="transform" 
      type="rotate" 
      values="0 200 330; -4.5 200 330; 2.25 200 330; 0 200 330" 
      dur="5s" 
      begin="-1.5s" 
      repeatCount="indefinite" 
    />
  </path>
  <path d="M 178 280 Q 151.5 273.0 130 290 Q 156.5 297.0 178 280 Z" fill="url(#hero-gold-leaf-r)" stroke="#9e7d2e" stroke-width="0.8" class="hero-leaf" filter="url(#hero-leaf-shadow-r)">
    <animateTransform 
      attributeName="transform" 
      type="rotate" 
      values="0 178 280; -5.5 178 280; 2.75 178 280; 0 178 280" 
      dur="5.7s" 
      begin="-3s" 
      repeatCount="indefinite" 
    />
  </path>
  <path d="M 185 140 Q 175.0 116.3 150 110 Q 160.0 133.8 185 140 Z" fill="url(#hero-gold-leaf-r)" stroke="#9e7d2e" stroke-width="0.8" class="hero-leaf" filter="url(#hero-leaf-shadow-r)">
    <animateTransform 
      attributeName="transform" 
      type="rotate" 
      values="0 185 140; -3.5 185 140; 1.75 185 140; 0 185 140" 
      dur="6.4s" 
      begin="-0s" 
      repeatCount="indefinite" 
    />
  </path>
  <path d="M 170 10 Q 172.5 -13.8 155 -30 Q 152.5 -6.3 170 10 Z" fill="url(#hero-gold-leaf-r)" stroke="#9e7d2e" stroke-width="0.8" class="hero-leaf" filter="url(#hero-leaf-shadow-r)">
    <animateTransform 
      attributeName="transform" 
      type="rotate" 
      values="0 170 10; -4.5 170 10; 2.25 170 10; 0 170 10" 
