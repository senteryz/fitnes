<svg viewBox="0 0 300 800" fill="none" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Градиент для золотых листьев -->
    <linearGradient id="hero-gold-leaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe8a3" />
      <stop offset="50%" stop-color="#d6b258" />
      <stop offset="100%" stop-color="#9e7d2e" />
    </linearGradient>
    
    <!-- Градиент для оливковых листьев -->
    <linearGradient id="hero-green-leaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cce0b4" />
      <stop offset="50%" stop-color="#809c5d" />
      <stop offset="100%" stop-color="#4a5d30" />
    </linearGradient>
    
    <!-- Градиент для стебля -->
    <linearGradient id="hero-stem-left" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#4a5d30" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#9e7d2e" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#d6b258" />
    </linearGradient>

    <!-- Фильтр свечения / тени для премиальности -->
    <filter id="hero-leaf-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Главный стебель -->
  <path d="M -50 850 C 100 700, 180 550, 70 400 C -20 280, 150 180, 110 50 C 100 20, 130 -20, 150 -50" stroke="url(#hero-stem-left)" stroke-width="4.5" stroke-linecap="round" filter="url(#hero-leaf-shadow)" />

  <!-- Веточки и прикрепленные к ним листья -->
  <g>
    <!-- Плавное колыхание веточки относительно ствола -->
    <animateTransform 
      attributeName="transform" 
      type="rotate" 
      values="0 85 640; 1.5 85 640; -0.8999999999999999 85 640; 0 85 640" 
      dur="8s" 
      begin="-0s" 
      repeatCount="indefinite" 
    />
    <path d="M 85 640 C 130 630, 200 580, 210 500" stroke="url(#hero-stem-left)" stroke-width="2" stroke-linecap="round" opacity="0.85" />
    <path d="M 210 500 Q 235.0 487.5 240 460 Q 215.0 472.5 210 500 Z" fill="url(#hero-gold-leaf)" stroke="#9e7d2e" stroke-width="0.8" class="hero-leaf" filter="url(#hero-leaf-shadow)">
      <animateTransform 
        attributeName="transform" 
        type="rotate" 
        values="0 210 500; 4 210 500; -2 210 500; 0 210 500" 
        dur="4.5s" 
        begin="-0s" 
        repeatCount="indefinite" 
      />
    </path>
    <path d="M 160 560 Q 175.0 580.0 200 580 Q 185.0 560.0 160 560 Z" fill="url(#hero-green-leaf)" stroke="#4a5d30" stroke-width="0.8" class="hero-leaf" filter="url(#hero-leaf-shadow)">
      <animateTransform 
        attributeName="transform" 
        type="rotate" 
        values="0 160 560; 6 160 560; -3 160 560; 0 160 560" 
        dur="5.3s" 
        begin="-1.2s" 
        repeatCount="indefinite" 
      />
    </path>
  </g>
  <g>
    <!-- Плавное колыхание веточки относительно ствола -->
    <animateTransform 
      attributeName="transform" 
      type="rotate" 
      values="0 72 410; 2 72 410; -1.2 72 410; 0 72 410" 
      dur="9.5s" 
      begin="-2s" 
      repeatCount="indefinite" 
    />
    <path d="M 72 410 C 20 400, 10 320, -10 280" stroke="url(#hero-stem-left)" stroke-width="2" stroke-linecap="round" opacity="0.85" />
    <path d="M -10 280 Q -7.5 250.0 -30 230 Q -32.5 260.0 -10 280 Z" fill="url(#hero-green-leaf)" stroke="#4a5d30" stroke-width="0.8" class="hero-leaf" filter="url(#hero-leaf-shadow)">
      <animateTransform 
        attributeName="transform" 
        type="rotate" 
        values="0 -10 280; 4 -10 280; -2 -10 280; 0 -10 280" 
        dur="4.5s" 
        begin="-0s" 
        repeatCount="indefinite" 
      />
    </path>
    <path d="M 30 350 Q 25.0 322.5 0 310 Q 5.0 337.5 30 350 Z" fill="url(#hero-gold-leaf)" stroke="#9e7d2e" stroke-width="0.8" class="hero-leaf" filter="url(#hero-leaf-shadow)">
      <animateTransform 
        attributeName="transform" 
        type="rotate" 
        values="0 30 350; 6 30 350; -3 30 350; 0 30 350" 
        dur="5.3s" 
        begin="-1.2s" 
        repeatCount="indefinite" 
      />
    </path>
  </g>
  <g>
    <!-- Плавное колыхание веточки относительно ствола -->
    <animateTransform 
      attributeName="transform" 
      type="rotate" 
      values="0 118 240; 2.5 118 240; -1.5 118 240; 0 118 240" 
      dur="11s" 
      begin="-4s" 
      repeatCount="indefinite" 
    />
    <path d="M 118 240 C 160 210, 220 180, 230 110" stroke="url(#hero-stem-left)" stroke-width="2" stroke-linecap="round" opacity="0.85" />
    <path d="M 230 110 Q 255.0 97.5 260 70 Q 235.0 82.5 230 110 Z" fill="url(#hero-gold-leaf)" stroke="#9e7d2e" stroke-width="0.8" class="hero-leaf" filter="url(#hero-leaf-shadow)">
      <animateTransform 
        attributeName="transform" 
        type="rotate" 
        values="0 230 110; 4 230 110; -2 230 110; 0 230 110" 
        dur="4.5s" 
        begin="-0s" 
        repeatCount="indefinite" 
      />
    </path>
    <path d="M 180 190 Q 195.0 210.0 220 210 Q 205.0 190.0 180 190 Z" fill="url(#hero-green-leaf)" stroke="#4a5d30" stroke-width="0.8" class="hero-leaf" filter="url(#hero-leaf-shadow)">
      <animateTransform 
        attributeName="transform" 
        type="rotate" 
        values="0 180 190; 6 180 190; -3 180 190; 0 180 190" 
        dur="5.3s" 
        begin="-1.2s" 
        repeatCount="indefinite" 
      />
    </path>
  </g>
  <g>
    <!-- Плавное колыхание веточки относительно ствола -->
    <animateTransform 
      attributeName="transform" 
      type="rotate" 
      values="0 112 110; 3 112 110; -1.7999999999999998 112 110; 0 112 110" 
      dur="12.5s" 
      begin="-6s" 
      repeatCount="indefinite" 
    />
    <path d="M 112 110 C 70 90, 50 40, 60 0" stroke="url(#hero-stem-left)" stroke-width="2" stroke-linecap="round" opacity="0.85" />
    <path d="M 60 0 Q 60.0 -25.0 40 -40 Q 40.0 -15.0 60 0 Z" fill="url(#hero-green-leaf)" stroke="#4a5d30" stroke-width="0.8" class="hero-leaf" filter="url(#hero-leaf-shadow)">
      <animateTransform 
        attributeName="transform" 
        type="rotate" 
        values="0 60 0; 4 60 0; -2 60 0; 0 60 0" 
        dur="4.5s" 
        begin="-0s" 
        repeatCount="indefinite" 
      />
    </path>
    <path d="M 80 55 Q 71.3 35.0 50 30 Q 58.8 50.0 80 55 Z" fill="url(#hero-gold-leaf)" stroke="#9e7d2e" stroke-width="0.8" class="hero-leaf" filter="url(#hero-leaf-shadow)">
      <animateTransform 
        attributeName="transform" 
        type="rotate" 
        values="0 80 55; 6 80 55; -3 80 55; 0 80 55" 
        dur="5.3s" 
        begin="-1.2s" 
        repeatCount="indefinite" 
      />
    </path>
  </g>

  <!-- Листья на основном стволе -->
  <path d="M 30 750 Q 62.5 747.5 80 720 Q 47.5 722.5 30 750 Z" fill="url(#hero-green-leaf)" stroke="#4a5d30" stroke-width="0.8" class="hero-leaf" filter="url(#hero-leaf-shadow)">
    <animateTransform 
      attributeName="transform" 
      type="rotate" 
      values="0 30 750; 3.5 30 750; -1.75 30 750; 0 30 750" 
      dur="5s" 
      begin="-0s" 
      repeatCount="indefinite" 
    />
  </path>
  <path d="M 85 680 Q 110.0 698.8 140 690 Q 115.0 671.3 85 680 Z" fill="url(#hero-gold-leaf)" stroke="#9e7d2e" stroke-width="0.8" class="hero-leaf" filter="url(#hero-leaf-shadow)">
    <animateTransform 
      attributeName="transform" 
      type="rotate" 
      values="0 85 680; 4.5 85 680; -2.25 85 680; 0 85 680" 
      dur="5.7s" 
      begin="-1.5s" 
      repeatCount="indefinite" 
    />
  </path>
  <path d="M 110 490 Q 145.0 482.5 160 450 Q 125.0 457.5 110 490 Z" fill="url(#hero-gold-leaf)" stroke="#9e7d2e" stroke-width="0.8" class="hero-leaf" filter="url(#hero-leaf-shadow)">
    <animateTransform 
      attributeName="transform" 
      type="rotate" 
      values="0 110 490; 5.5 110 490; -2.75 110 490; 0 110 490" 
      dur="6.4s" 
      begin="-3s" 
      repeatCount="indefinite" 
    />
  </path>
  <path d="M 78 430 Q 49.0 428.0 30 450 Q 59.0 452.0 78 430 Z" fill="url(#hero-green-leaf)" stroke="#4a5d30" stroke-width="0.8" class="hero-leaf" filter="url(#hero-leaf-shadow)">
    <animateTransform 
      attributeName="transform" 
      type="rotate" 
      values="0 78 430; 3.5 78 430; -1.75 78 430; 0 78 430" 
      dur="7.1s" 
      begin="-0s" 
      repeatCount="indefinite" 
    />
  </path>
  <path d="M 100 330 Q 85.0 310.0 60 310 Q 75.0 330.0 100 330 Z" fill="url(#hero-green-leaf)" stroke="#4a5d30" stroke-width="0.8" class="hero-leaf" filter="url(#hero-leaf-shadow)">
    <animateTransform 
      attributeName="transform" 
      type="rotate" 
      values="0 100 330; 4.5 100 330; -2.25 100 330; 0 100 330" 
      dur="5s" 
      begin="-1.5s" 
      repeatCount="indefinite" 
    />
  </path>
  <path d="M 122 280 Q 143.5 297.0 170 290 Q 148.5 273.0 122 280 Z" fill="url(#hero-gold-leaf)" stroke="#9e7d2e" stroke-width="0.8" class="hero-leaf" filter="url(#hero-leaf-shadow)">
    <animateTransform 
      attributeName="transform" 
      type="rotate" 
      values="0 122 280; 5.5 122 280; -2.75 122 280; 0 122 280" 
      dur="5.7s" 
      begin="-3s" 
      repeatCount="indefinite" 
    />
  </path>
  <path d="M 115 140 Q 140.0 133.8 150 110 Q 125.0 116.3 115 140 Z" fill="url(#hero-gold-leaf)" stroke="#9e7d2e" stroke-width="0.8" class="hero-leaf" filter="url(#hero-leaf-shadow)">
    <animateTransform 
      attributeName="transform" 
      type="rotate" 
      values="0 115 140; 3.5 115 140; -1.75 115 140; 0 115 140" 
      dur="6.4s" 
      begin="-0s" 
      repeatCount="indefinite" 
    />
  </path>
  <path d="M 130 10 Q 147.5 -6.3 145 -30 Q 127.5 -13.8 130 10 Z" fill="url(#hero-gold-leaf)" stroke="#9e7d2e" stroke-width="0.8" class="hero-leaf" filter="url(#hero-leaf-shadow)">
    <animateTransform 
      attributeName="transform" 
      type="rotate" 
      values="0 130 10; 4.5 130 10; -2.25 130 10; 0 130 10" 
      dur="7.1s" 
      begin="-1.5s" 
      repeatCount="indefinite" 
    />
  </path>
</svg>